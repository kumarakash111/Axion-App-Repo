apiVersion: apps/v1
kind: Deployment
metadata:
  name: telequiery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telequiery
  template:
    metadata:
      labels:
        app: telequiery
    spec:
      containers:
      - name: telemetry-query-service
        image: acraxionservice.azurecr.io/axion-telemetry-query-service:v1
        ports:
        - containerPort: 8080
